<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PINTAR - Setup Terminal</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-100">
        <div class="text-center mb-8">
            <div class="bg-blue-600 text-white w-16 h-16 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-3 shadow-lg shadow-blue-200">
                <i class='bx bx-devices'></i>
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Sistem PINTAR</h1>
            <p class="text-sm text-slate-500 mt-1">Konfigurasi Sesi Terminal Presensi</p>
        </div>

        <form action="/" method="POST" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Target Agama Siswa</label>
                <select name="target_agama" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 bg-white transition" required>
                    <option value="Islam">Islam</option>
                    <option value="Kristen">Kristen</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Khonghucu">Khonghucu</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Nama Sesi Ibadah</label>
                <input type="text" name="sesi_ibadah" placeholder="Contoh: Shalat Dzuhur Berjamaah" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-blue-600 transition" required>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-blue-200 flex items-center justify-center gap-2 cursor-pointer">
                <i class='bx bx-power-off'></i> Aktifkan Terminal Mesin
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <a href="/login" class="text-sm text-blue-600 hover:underline inline-flex items-center gap-1 font-medium">
                <i class='bx bx-log-in-circle'></i> Masuk Dashboard Admin
            </a>
        </div>
    </div>
</body>
</html>
